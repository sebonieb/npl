<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opisy wizyt NPL</title>
<style>
:root{font-family:system-ui,Arial,sans-serif;color:#17212c;background:#f5f7fa}body{max-width:950px;margin:32px auto;padding:0 18px}h1{font-size:1.5rem} .panel{background:white;border:1px solid #dce2e9;border-radius:12px;padding:20px;margin-bottom:16px} .controls{display:flex;gap:16px;align-items:end;flex-wrap:wrap}label{font-weight:600}select,input,textarea,button{font:inherit}select,input[type=number]{padding:10px;border:1px solid #abb7c5;border-radius:7px}select{min-width:260px}input[type=number]{width:90px}.radio{font-weight:400} .link{min-height:1.4em;margin:14px 0 0}a{color:#125aa2}textarea{box-sizing:border-box;width:100%;min-height:570px;padding:16px;line-height:1.55;border:1px solid #abb7c5;border-radius:8px;resize:vertical}button{background:#175ea8;border:0;color:white;padding:10px 18px;border-radius:7px;cursor:pointer}button:hover{background:#104b87}.actions{display:flex;align-items:center;gap:12px;margin-top:12px}#status{color:#16713d}
</style>
</head>
<body>
<h1>Opisy wizyt NPL</h1>
<div class="panel">
<div class="controls">
<label for="choroba">Opis<br><select id="choroba"><option value="standard">Standard</option><option value="ucho">Zapalenie ucha</option><option value="kleszcz">Ugryzienie przez kleszcza</option></select></label>
<label for="wiek">Wiek<br><input id="wiek" type="number" min="0" max="120" value="43" inputmode="numeric"></label>
<div><label><input type="radio" name="plec" value="K" checked> Pacjentka</label> &nbsp; <label><input type="radio" name="plec" value="M"> Pacjent</label></div>
</div>
<p class="link" id="link"></p>
</div>
<div class="panel"><label for="opis">Opis do edycji i skopiowania</label><textarea id="opis" spellcheck="true"></textarea><div class="actions"><button id="kopiuj" type="button">Kopiuj opis</button><span id="status" role="status" aria-live="polite"></span></div></div>
<script>
const standardStart='z powodu zaczerwienienia i łzawienia oka. W wywiadzie brak urazu.';
const earStart='z powodu nasilającego się od wczoraj silnego bólu ucha lewego, osłabienia słuchu, gorączki w pomiarze domowym – 39°C. Od kilku dni odczuwał osłabienie, katar oraz ból gardła.';
const tickStart='z powodu ugryzienia przez kleszcza. Zauważył go dziś rano.';
const general='Stan ogólny dobry, pacjentka wydolna krążeniowo-oddechowo, w kontakcie logicznym. Akcja serca miarowa, bez wyraźnie słyszalnych szmerów patologicznych. Szmer pęcherzykowy symetryczny obustronnie nad polami płucnymi.';
const abdomen='Brzuch miękki, niebolesny, bez oporów patologicznych, bez objawów otrzewnowych. Perystaltyka zachowana. Objaw Blumberga ujemny.';
const neck='Węzły chłonne szyjne niewyczuwalne w badaniu palpacyjnym.';
const earExam='Brak bolesności przy opukiwaniu wyrostka sutkowatego. Brak odchyleń w badaniu zakresu unerwienia nerwu twarzowego. Objawy oponowe ujemne.  W badaniu otoskopowym w uchu prawym kanał słuchowy bez zmian zapalnych, błona bębenkowa całkowicie uwidoczniona, prześwitująca, bez perforacji, z prawidłowym refleksem świetlnym.\n\nW badaniu otoskopowym w uchu lewym kanał słuchowy bez zmian zapalnych, błona bębenkowa uwypuklona, zmętniona, silne przekrwiona, bez refleksu świetlnego.';
const tickExam='Objawy oponowe ujemne. Źrenice równe, symetryczne, prawidłowo reagujące na światło. Bez oczopląsu. Ruchy gałek ocznych zachowane w płaszczyźnie poziomej i pionowej. Czucie w obrębie twarzy zachowane. Pacjent czuje zapach oraz smak. Ruchy języka zachowane, łuki gardłowe symetryczne. Mimika symetryczna. Ruchy głowy i ramion zachowane. Ruchy języka zachowane. Siła mięśniowa L=P. Próba palec nos ujemna. Próba Romberga ujemna. Na skórze pleców widoczny insekt. Skóra wokół zaczerwieniona.\n\nKleszcza usunięto, miejsce ukąszenia zdezynfekowano.';
const ekg='EKG - rytm serca zatokowy, miarowy o częstości /min, oś serca pośrednia. Bez wyraźnie widocznych specyficznych zmian odcinka ST-T.';
const end='Ambulatoryjnie podano: xxxx\n\nZalecenia:\nxxxx\nW badaniu nie stwierdzono ewidentnych cech ostrego stanu zagrożenia życia. Zalecono obserwację i kontakt z lekarzem w razie braku poprawy, pogorszenia stanu zdrowia lub wezwanie ZRM/zgłoszenie się na SOR w przypadku wystąpienia objawów alarmowych (np. nasilający się ból, krwawienie z przewodu pokarmowego, gorączka, trudności w oddychaniu, wymioty, zaburzenia świadomości, wstrząs) o których poinformowano pacjenta. Ponadto przekazano informację o ryzyku związanym z nieprzestrzeganiem zaleceń lekarskich.';
const select=document.getElementById('choroba'), age=document.getElementById('wiek'), output=document.getElementById('opis'), link=document.getElementById('link');
function render(){const type=select.value, female=document.querySelector('input[name="plec"]:checked').value==='K';const subject=`${age.value.trim() || '43'}-letni${female?'a':''} ${female?'pacjentka zgłosiła':'pacjent zgłosił'} się do NPL`;
let start=type==='ucho'?earStart:type==='kleszcz'?tickStart:standardStart;
if(female){start=start.replace('odczuwał','odczuwała').replace('Zauważył','Zauważyła')}
let exam=type==='ucho'?earExam:abdomen;
let text=[`${subject} ${start} Inne dolegliwości neguje. Uczuleń na leki – nie zgłasza.`, 'Temp. st C, BP / mmHg, HR /min, SpO2 %.', `${general} ${exam} ${neck}${type==='kleszcz'?'\n'+tickExam:''}`,ekg,end].join('\n\n');
if(!female) text=text.replace('pacjentka wydolna','pacjent wydolny').replace('o których poinformowano pacjenta','o których poinformowano pacjenta');
output.value=text;
link.replaceChildren();if(type==='ucho'){const a=document.createElement('a');a.href='https://www.poz1.pl/jednostki/c9c88cbc-c5ac-4e30-820c-469fcdd357a2';a.target='_blank';a.rel='noopener noreferrer';a.textContent='Otwórz stronę o zapaleniu ucha ↗';link.append(a)}document.getElementById('status').textContent='';}
select.addEventListener('change',render);age.addEventListener('change',render);document.querySelectorAll('input[name="plec"]').forEach(r=>r.addEventListener('change',render));
document.getElementById('kopiuj').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(output.value);document.getElementById('status').textContent='Skopiowano.'}catch{output.select();document.getElementById('status').textContent='Zaznaczono tekst — użyj Ctrl+C.'}});render();
</script>
</body>
</html>
